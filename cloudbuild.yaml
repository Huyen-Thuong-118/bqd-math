substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: bqdmath
  _SERVICE: bqdmath-web

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    args:
      - -ceu
      - |
        export DOCKER_BUILDKIT=1
        docker build \
          --secret id=next_server_actions_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY \
          --build-arg DEPLOYMENT_VERSION="$BUILD_ID" \
          --tag "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID" \
          .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=bqdmath-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=40
      - --min-instances=0
      - --max-instances=10
      - --timeout=300s
      - --execution-environment=gen2
      - --update-env-vars=AUTH_TRUST_HOST=true,GEMINI_MODEL=gemini-3.1-flash-lite,DEPLOYMENT_VERSION=$BUILD_ID
      - --update-secrets=DATABASE_URL=database-url:latest,AUTH_SECRET=auth-secret:latest,NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=next-server-actions-key:latest,R2_ACCOUNT_ID=r2-account-id:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,R2_BUCKET_NAME=r2-bucket-name:latest,GEMINI_API_KEY=gemini-api-key:latest,RESEND_API_KEY=resend-api-key:latest,EMAIL_FROM=email-from:latest,RESET_TOKEN_SECRET=reset-token-secret:latest,CRON_SECRET=cron-secret:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/next-server-actions-key/versions/latest
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
