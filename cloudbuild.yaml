substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: bqdmath
  _SERVICE: bqdmath-web
  _CLOUD_SQL_INSTANCE: bqdmath-postgres
  _DB_NAME: bqdmath
  _DB_USER: bqdmath
  _GCS_BUCKET: bqd-math-507809-bqdmath-files

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    args:
      - -ceu
      - |
        export DOCKER_BUILDKIT=1
        docker build \
          --secret id=next_server_actions_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY \
          --build-arg DEPLOYMENT_VERSION="$BUILD_ID" \
          --tag "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID" \
          .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=bqdmath-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_CLOUD_SQL_INSTANCE}
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=40
      - --min-instances=0
      - --max-instances=10
      - --timeout=300s
      - --execution-environment=gen2
      - --update-env-vars=AUTH_TRUST_HOST=true,CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_CLOUD_SQL_INSTANCE},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_GENAI_USE_ENTERPRISE=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-3.1-flash-lite,DEPLOYMENT_VERSION=$BUILD_ID
      - --update-secrets=DB_PASSWORD=db-password:latest,AUTH_SECRET=auth-secret:latest,NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=next-server-actions-key:latest,RESEND_API_KEY=resend-api-key:latest,EMAIL_FROM=email-from:latest,RESET_TOKEN_SECRET=reset-token-secret:latest,CRON_SECRET=cron-secret:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/next-server-actions-key/versions/latest
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
