services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bqdmath
      POSTGRES_USER: bqdmath
      POSTGRES_PASSWORD: bqdmath_dev
    ports:
      # Chỉ máy hiện tại truy cập được; không mở PostgreSQL ra mạng LAN/Internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - bqdmath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bqdmath -d bqdmath"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    build:
      context: ./services/ocr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      QUESTION_IMPORT_STORAGE_ROOT: /data/question-import
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - bqdmath_question_import_data:/data/question-import
      # Cho phép importer dùng ADC được tạo bởi `npm run setup:local:vertex`.
      # Trên production, workload identity/service account thay thế mount này.
      - ${BQDMATH_GCLOUD_CONFIG_DIR:-${HOME:-.}/.config/gcloud}:/root/.config/gcloud:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bqdmath_postgres_data:
  bqdmath_question_import_data:
